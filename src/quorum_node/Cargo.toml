[package]
publish = false
name = "quorum_node"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "Standalone, independently-testable quorum node binary: DKG + threshold derive over real mutual TLS between separate OS processes. Phase 1 of the threshold-quorum roadmap."

[dependencies]
quorum_core = { path = "../quorum_core" }
quorum_audit = { path = "../quorum_audit" }
quorum_vetseal = { path = "../quorum_vetseal" }
# Audit finding A4: migrated from 1.x. Pinned to 2.1.1, not the latest
# 2.2.0, because 2.2.0 bumped its own declared MSRV to rustc 1.81 --
# above this workspace's pinned 1.75 -- while 2.1.1 still declares 1.60
# (confirmed against the crates.io index, not assumed). base64ct is a
# transitive dependency (via ed25519 -> pkcs8/spki) that separately hits
# the usual edition2024 wall at its newest releases; pinned below it for
# the same reason as every other pin in this file.
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
base64ct = "=1.6.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = "0.24"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# --- Sandbox-only pins, NOT a real production dependency policy ---
# Same rustc-1.75-vs-edition2024 wall as the rest of this workspace.
# `time` (pulled in transitively via tokio) is the one that needs pinning
# here; the original occurrence of this issue was in the project's
# now-deleted Internet Computer canister prototype, which is where this
# pin pattern was first inherited from. Delete on rustup 1.85+.
zeroize = "=1.5.7"
zeroize_derive = "=1.4.2"
