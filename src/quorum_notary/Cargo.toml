[package]
publish = false
name = "quorum_notary"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "Standalone external notarization service for Phase 2 of the threshold-quorum roadmap: an identity and process genuinely outside the quorum's own control, which timestamps and signs published audit-log root hashes on request."

[dependencies]
quorum_audit = { path = "../quorum_audit" }
quorum_core = { path = "../quorum_core" }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
base64 = "0.22"
