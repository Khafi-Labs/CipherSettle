[package]
publish = false
name = "quorum_service"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "Phase 3 of the threshold-quorum roadmap: the product REST API, ported from the earlier Internet Computer canister prototype (ciphersettle_backend, since deleted -- see finding A14 of the audit remediation roadmap) onto Postgres storage + the Phase 1/2 quorum (DKG/derive + audit log) instead of ic-cdk/vetKD. ciphersettle_core's decision functions are reused unchanged."

[dependencies]
ciphersettle_core = { path = "../ciphersettle_core" }
quorum_core = { path = "../quorum_core" }
quorum_audit = { path = "../quorum_audit" }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
quorum_client = { path = "../quorum_client" }
quorum_vetseal = { path = "../quorum_vetseal" }
axum = "0.7"
# Audit finding A5: TLS termination for the HTTP API. These are axum
# 0.7's own low-level building blocks (the same ones axum::serve uses
# internally for the non-TLS case), not a new HTTP stack -- used
# directly here, following axum's own documented "low-level rustls"
# pattern, rather than pulling in axum-server: that crate's latest
# release (0.6.0) predates, and is API-incompatible with, the
# hyper-util version this workspace's axum 0.7.9 already resolves to (a
# real crate compatibility gap, hit and confirmed by trying it -- not a
# toolchain-wall issue). Deliberately HTTP/1.1-only (no "http2" feature
# on hyper, no "server-auto" on hyper-util): this service's API doesn't
# need HTTP/2, and enabling it pulls in h2 -> indexmap 2.3+ ->
# hashbrown 0.15+ -- avoiding the feature is simpler than adding
# another dependency chain here.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
tower = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
subtle = "2"

[dev-dependencies]
rand = "0.8"
