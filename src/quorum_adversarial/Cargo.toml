[package]
publish = false
name = "quorum_adversarial"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "Phase 4 of the threshold-quorum roadmap: adversarial tests run against the real, already-built system (quorum_node, quorum_client, quorum_service) rather than a spec. Each test either confirms a defense holds or reproduces a documented (or newly discovered) gap concretely, with a pass/fail verdict."

[dependencies]
ciphersettle_core = { path = "../ciphersettle_core" }
quorum_core = { path = "../quorum_core" }
quorum_audit = { path = "../quorum_audit" }
quorum_client = { path = "../quorum_client" }
quorum_vetseal = { path = "../quorum_vetseal" }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8"
rcgen = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
base64 = "0.22"
