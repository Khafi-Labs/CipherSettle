# Pins the toolchain this workspace builds against, for local `rustup`
# installs and for CI (.github/workflows/ci.yml reads `channel` from this
# file, so CI cannot drift from what a clone builds with).
#
# Gap 7: moved from 1.75.0 to 1.97. The 1.75 pin existed to dodge the
# `edition2024` wall of the old `threshold_crypto` dependency chain (finding
# A6, now resolved). The two-component form tracks 1.97.x patch releases.
# Verified on 1.97 (see agent_memory/SESSION_01_BASELINE_AND_PLAN.md, session 05).
[toolchain]
channel = "1.97"
components = ["clippy", "rustfmt"]
