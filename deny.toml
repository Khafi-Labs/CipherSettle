# Audit finding A9, step 3: license and duplicate-dependency policy,
# enforced by the supply-chain job in .github/workflows/ci.yml. Run
# locally with `cargo deny check`.

[graph]
# Advisory/license/ban checks apply to every target this workspace
# actually builds for; this project doesn't cross-compile.
targets = []
all-features = false
no-default-features = false

# ---------------------------------------------------------------------
# Advisories (RUSTSEC database). ci/audit_ignores.sh derives the
# `cargo audit --ignore` list from this block, so `cargo deny check` and
# `cargo audit` in CI always agree. Gap 7 removed the postgres-protocol /
# tokio-postgres / time ignores by lifting the sandbox pins (executed:
# cargo audit with no ignores now reports only the three rustls-webpki IDs).
# ---------------------------------------------------------------------
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rustls-webpki 0.101.7 (RUSTSEC-2026-0098, -0099, -0104): name-constraint
    # acceptance and CRL parsing. Fix means migrating rustls 0.21 -> 0.23.
    # ASSESSMENT, NOT A PROOF: every TLS verifier in this workspace is a
    # custom pinned-DER-equality verifier (quorum_node/quorum_client/
    # quorum_notary tls.rs) that never calls WebPkiVerifier, path building or
    # CRL handling, and no CRLs are ever supplied. rustls may still parse the
    # end-entity cert during the handshake. Needs human review; remove when
    # rustls is migrated.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]

# ---------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------
[licenses]
version = 2
# This project's own crates (ciphersettle_core, quorum_core, quorum_node,
# ...) are unpublished workspace members that do carry a `license` field
# (`Apache-2.0`, matching the repository's LICENSE file). `private.ignore`
# keeps cargo-deny from also applying the *publish* rules to them -- it is
# an exemption from crates.io publishing policy, NOT from the license
# allow-list above, which these crates must still satisfy like any other
# dependency.
private = { ignore = true }
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "OpenSSL",
]
exceptions = [
    # ring is BoringSSL-derived and carries a mixed OpenSSL/ISC/MIT
    # license; widely accepted in the Rust ecosystem under exactly this
    # exception pattern (rustls, tokio-rustls, and most of the TLS stack
    # this project already depends on pull it in transitively).
    { allow = ["OpenSSL", "ISC", "MIT"], name = "ring" },
]

# ---------------------------------------------------------------------
# Bans: duplicate dependencies and other dependency-graph hygiene
# ---------------------------------------------------------------------
[bans]
# `warn`, not `deny`: the A6 cutover to `blstrs` is done and
# `threshold_crypto` (with its `ff 0.6`/`pairing 0.16` chain) is gone, but
# other duplicated transitive versions (base64, sha2, digest, ...) may
# remain. TODO: run `cargo deny check bans` and, once the remaining
# duplicates are understood, tighten this to `deny`.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# ---------------------------------------------------------------------
# Sources: only the official crates.io registry, no unpinned git deps
# ---------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
