# TEMPORARY (dependency-upgrade branch only): reports compiler errors as
# annotations because job logs cannot be read from the API.
name: diagnose
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the pinned toolchain
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal
          rustup default "$v"
      - name: cargo check, errors as annotations
        run: |
          set +e
          cargo check --workspace --all-targets --message-format=short > check.log 2>&1
          rc=$?
          grep -E "error|warning: unused" check.log | head -80 | cut -c1-380 > errs.txt
          python3 - <<'PY'
          lines = open("errs.txt").read().splitlines()
          chunk, size, n = [], 0, 0
          def flush():
              global chunk, size, n
              if chunk:
                  n += 1
                  msg = "%0A".join(c.replace("%", "%25") for c in chunk)
                  print(f"::error title=compile-{n}::{msg}")
              chunk, size = [], 0
          for line in lines:
              if size + len(line) > 3000:
                  flush()
              chunk.append(line)
              size += len(line)
          flush()
          PY
          exit $rc
