# Gap 6. Every `run:` command below is a plain shell command that can be
# executed locally; see agent_memory/SESSION_01_BASELINE_AND_PLAN.md for which
# have been executed and which (the GitHub-only parts) have NOT.
#
# Third-party actions are pinned to full commit SHAs (resolved with
# `git ls-remote` on 2026-10-02), not mutable tags.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # daily: new advisories can break a green tree

permissions:
  contents: read

# `shell: bash` makes every `run:` use `bash -eo pipefail`, so a failing command
# on the left of `| tee` fails the step (the unspecified default has no pipefail).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CIPHERSETTLE_TEST_DB_URL: postgres://postgres:ciphersettle_dev@127.0.0.1:5432/ciphersettle_test

jobs:
  lint:
    name: fmt, clippy, pin policy (pinned toolchain)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal --component clippy --component rustfmt
          rustup default "$v"
          rustc --version
      - name: Active compiler must equal the pin (a different rustc proves nothing)
        run: bash ci/assert_toolchain_pinned.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: bash ci/check_pin_policy.sh
      - name: Dockerfile policy (non-root, tagged bases, exec entrypoint, no baked-in secrets)
        run: bash ci/check_dockerfile.sh
      - name: The Dockerfile policy rejects a deliberately bad Dockerfile
        run: "! bash ci/check_dockerfile.sh ci/fixtures/Dockerfile.bad /nonexistent"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Fuzz setup is internally consistent (targets, bodies, matrix, corpus)
        run: bash ci/check_fuzz_setup.sh
      - name: The fuzz-run gate rejects short runs, crashes and timeouts (synthetic logs)
        run: bash ci/check_fuzz_assert.sh
      - name: libFuzzer crate type-checks on the pinned toolchain (it is NOT run here)
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          cargo +"$v" check --locked --manifest-path fuzz/Cargo.toml --bins

  test:
    name: build + test with Postgres (DB required)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ciphersettle_dev   # test-only credential
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # A DB test that cannot reach Postgres FAILS instead of skipping.
      CIPHERSETTLE_TEST_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal
          rustup default "$v"
      - name: Active compiler must equal the pin (a different rustc proves nothing)
        run: bash ci/assert_toolchain_pinned.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: DB-required mode must be on (a skipped DB test must be a failure)
        run: test "$CIPHERSETTLE_TEST_DB_REQUIRED" = "1"
      - name: Create test databases
        run: bash ci/setup_test_db.sh
      - run: cargo build --workspace --locked --all-targets
      # Includes the unit regressions and the committed fuzz-corpus replay
      # (quorum_adversarial corpus_tests); NOT coverage-guided fuzzing.
      - run: cargo test --workspace --locked
      # Belt and braces: independent of the env var above, prove the DB tests
      # genuinely ran (a skip is reported by cargo as a pass).
      - name: Assert DB tests ran, not skipped
        run: bash ci/assert_db_tests_ran.sh
      - name: Backup -> restore rehearsal (Postgres tier) with digest comparison
        run: bash ci/backup_restore_rehearsal.sh rehearsal_out

  adversarial:
    name: adversarial suite (groups A-G, I-N, P, Q, R, S, Z; H needs iptables, see notes)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ciphersettle_dev   # test-only credential
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal
          rustup default "$v"
      - name: Active compiler must equal the pin (a different rustc proves nothing)
        run: bash ci/assert_toolchain_pinned.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: adv-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: bash ci/setup_test_db.sh
      - run: cargo build --workspace --locked --all-targets
      # The runner exits 1 if ANY check fails, and records a skipped group
      # (e.g. no Postgres) as a failure, so a skip cannot pass here.
      - name: Run adversarial suite
        run: cargo run --locked -p quorum_adversarial -- --only A,B,C,D,M,L,E,I,F,G,J,K,N,Z,P,Q,R,S,W | tee adversarial.log
      - name: Require the full expected check count
        run: |
          grep -q '^72/72 checks passed as expected\.' adversarial.log
          ! grep -q '^\[FAIL\]' adversarial.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: adversarial-log
          path: adversarial.log

  db-guard-negative:
    name: negative test, a broken DB setup must FAIL, not skip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          v=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$v" --profile minimal
          rustup default "$v"
      - name: Active compiler must equal the pin (a different rustc proves nothing)
        run: bash ci/assert_toolchain_pinned.sh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: neg-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: bash ci/check_ci_fails_on_broken_db.sh

  supply-chain:
    name: cargo audit + cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          # Versions pinned to the ones actually executed locally (2026-10-03).
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
      # Accepted advisories come from deny.toml only; see ci/audit_ignores.sh.
      - run: cargo audit $(bash ci/audit_ignores.sh)
      - run: cargo deny check

  container-image:
    name: container image (${{ matrix.bin }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bin: [quorum_node, quorum_service, quorum_notary]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build the image
        run: docker build --build-arg BIN=${{ matrix.bin }} -t ciphersettle/${{ matrix.bin }}:ci .
      - name: Runs as a non-root user and contains no shell
        run: |
          u=$(docker inspect --format '{{.Config.User}}' ciphersettle/${{ matrix.bin }}:ci)
          echo "image user: $u"; case "$u" in ""|0|root|0:*|root:*) echo "FAIL: root image"; exit 1;; esac
          ! docker run --rm --entrypoint /bin/sh ciphersettle/${{ matrix.bin }}:ci -c true 2>/dev/null
      - name: No config, key or share material is baked into the image filesystem
        run: |
          id=$(docker create ciphersettle/${{ matrix.bin }}:ci)
          docker export "$id" | tar -t > /tmp/fs.txt; docker rm "$id" >/dev/null
          wc -l /tmp/fs.txt
          ! grep -E '\.(pem|key|der|json)$' /tmp/fs.txt
